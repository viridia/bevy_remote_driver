[package]
name = "bevy_remote_driver"
description = "Drive a running Bevy app from outside for automated tests, over the Bevy Remote Protocol"
keywords = ["bevy", "testing", "remote"]
categories = ["game-development", "development-tools::testing"]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/viridia/bevy_remote_driver"
# Rust and a Python client together do not ship as a crate. The Rust half is meant for Bevy itself
# (docs/upstream.md); what Bevy declines stays here, used by git dependency.
publish = false

[lints.rust]
missing_docs = "warn"

# Subcrates rather than the umbrella: the server methods are candidates for upstream, and an app
# under test already has the umbrella.
#
# Bevy is named by branch, as in every repo that uses this crate: Cargo treats a branch and a rev
# as different sources even at the same commit, which would build two Bevys. `Cargo.lock` holds the
# commit.
[dependencies]
bevy_app = { git = "https://github.com/bevyengine/bevy.git", branch = "main" }
bevy_diagnostic = { git = "https://github.com/bevyengine/bevy.git", branch = "main" }
bevy_ecs = { git = "https://github.com/bevyengine/bevy.git", branch = "main" }
bevy_remote = { git = "https://github.com/bevyengine/bevy.git", branch = "main", default-features = false, features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# For `examples/testbed.rs`. The umbrella's `bevy_remote` feature registers `Image`'s
# serialization, without which a screenshot step panics the app rather than failing the step.
# `bevy_debug_stepping` is for `tests/scene_readiness.rs`.
[dev-dependencies]
bevy = { git = "https://github.com/bevyengine/bevy.git", branch = "main", features = ["dynamic_linking", "bevy_remote", "bevy_debug_stepping"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
